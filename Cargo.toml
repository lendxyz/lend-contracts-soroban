[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/dummy-usdc",
    "contracts/factory",
    "contracts/op-lend",
    "contracts/op-lend-wallet",
    "contracts/rewards",
]

[workspace.dependencies]
soroban-sdk = "25"
soroban-token-sdk = { version = "25.1.0" }
common = { path = "contracts/common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
